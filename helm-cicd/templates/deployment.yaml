apiVersion: apps/v1
kind: Deployment

metadata:
  name: cicd-demo-deployment
  labels:
    app: cicd-demo

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: cicd-demo

  template:
    metadata:
      labels:
        app: cicd-demo

    spec:
      containers:
        - name: cicd-demo

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 3000