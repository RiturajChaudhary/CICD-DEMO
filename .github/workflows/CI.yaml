name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "helm-cicd/**"
      - "README.md"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "helm-cicd/**"
      - "README.md"

permissions:
  contents: write

env:
  DOCKER_IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/cicd-demo
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ============================================================
  # 1. CODE QUALITY + SONARQUBE
  # ============================================================
  sonar:
    name: Build, Test and SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Setup pnpm
      # --------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          run_install: false

      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Verify Node.js and pnpm
        run: |
          node --version
          pnpm --version

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --------------------------------------------------------
      # Lint
      # --------------------------------------------------------
      - name: Run lint
        run: pnpm lint

      # --------------------------------------------------------
      # Tests + Coverage
      # --------------------------------------------------------
      - name: Run tests
        run: pnpm test --coverage

      # --------------------------------------------------------
      # SonarQube Scan
      # --------------------------------------------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # --------------------------------------------------------
      # SonarQube Quality Gate
      # --------------------------------------------------------
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ============================================================
  # 2. DEPENDENCY SECURITY
  # ============================================================
  security:
    name: Dependency Security Scan
    needs: sonar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create reports directory
        run: mkdir -p reports

      # --------------------------------------------------------
      # pnpm Audit
      # --------------------------------------------------------
      - name: pnpm Security Audit
        continue-on-error: true
        run: |
          pnpm audit --audit-level=high --json > reports/pnpm-audit.json || true
          pnpm audit --audit-level=high > reports/pnpm-audit.txt || true

      # --------------------------------------------------------
      # OWASP Dependency-Check
      # --------------------------------------------------------
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: "cicd-demo"
          path: "."
          format: "ALL"
          out: "reports"
          args: >
            --enableRetired

      # --------------------------------------------------------
      # Upload reports
      # --------------------------------------------------------
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-security-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14


  # ============================================================
  # 3. DOCKER BUILD + TRIVY
  # ============================================================
  docker:
    name: Docker Build + Trivy
    needs: security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Build Docker image locally
      # --------------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}

      # --------------------------------------------------------
      # Trivy vulnerability scan
      # --------------------------------------------------------
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true


  # ============================================================
  # 4. DOCKER PUSH
  # ============================================================
  docker-push:
    name: Push Docker Image
    needs: docker

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Docker Hub login
      # --------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --------------------------------------------------------
      # Build + Push immutable SHA image
      # --------------------------------------------------------
      - name: Build and Push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}


  # ============================================================
  # 5. UPDATE HELM
  # ============================================================
  helm-update:
    name: Update Helm Image
    needs: docker-push

    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # Checkout using PAT
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      # --------------------------------------------------------
      # Configure Git
      # --------------------------------------------------------
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # --------------------------------------------------------
      # Update image repository
      # --------------------------------------------------------
      - name: Update Helm image repository
        run: |
          sed -i "s|repository:.*|repository: $DOCKER_IMAGE|" \
            helm-cicd/values.yaml

      # --------------------------------------------------------
      # Update immutable image tag
      # --------------------------------------------------------
      - name: Update Helm image tag
        run: |
          sed -i "s|tag:.*|tag: \"$IMAGE_TAG\"|" \
            helm-cicd/values.yaml

      # --------------------------------------------------------
      # Validate values
      # --------------------------------------------------------
      - name: Validate Helm values
        run: |
          cat helm-cicd/values.yaml

      # --------------------------------------------------------
      # Commit
      # --------------------------------------------------------
      - name: Commit Helm update
        run: |
          git add helm-cicd/values.yaml

          git diff --cached --quiet || \
            git commit -m "chore: update image to $IMAGE_TAG"

      # --------------------------------------------------------
      # Push
      # --------------------------------------------------------
      - name: Push Helm update
        run: |
          git push origin HEAD:main

