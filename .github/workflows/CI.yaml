name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "helm-cicd/**"
      - "README.md"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "helm-cicd/**"
      - "README.md"

env:
  DOCKER_IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/cicd-demo
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ============================================================
  # 1. CODE QUALITY + SONARQUBE
  # ============================================================
  sonar:
    name: Build, Test and SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup pnpm (Latest v4)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # Setup Node.js (Latest v4)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Verify Node.js and pnpm
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test --coverage

      # SonarQube Scan (Latest v6)
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # SonarQube Quality Gate (Latest v1)
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ============================================================
  # 2. DEPENDENCY SECURITY
  # ============================================================
  security:
    name: Dependency Security Scan
    needs: sonar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Reports Directory
        run: mkdir -p reports

      # pnpm Audit (Save Report & Allow Flow to Continue)
      - name: pnpm Security Audit
        continue-on-error: true
        run: |
          pnpm audit --audit-level=high --json > reports/pnpm-audit.json || true
          pnpm audit --audit-level=high > reports/pnpm-audit.txt || true

      # OWASP Dependency-Check (Pinned Tag v1.2.1)
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@v1.2.1
        continue-on-error: true
        with:
          project: "cicd-demo"
          path: "."
          format: "ALL"
          out: "reports"
          args: >
            --enableRetired

      # Upload All Generated Reports
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          if-no-files-found: warn
          retention-days: 14


  # ============================================================
  # 3. DOCKER BUILD + TRIVY
  # ============================================================
  docker:
    name: Docker Build + Trivy
    needs: security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}

      # Trivy vulnerability scan
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          image-ref: "${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true


  # ============================================================
  # 4. DOCKER PUSH
  # ============================================================
  docker-push:
    name: Push Docker Image
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}


  # ============================================================
  # 5. UPDATE HELM
  # ============================================================
  helm-update:
    name: Update Helm Image
    needs: docker-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout using PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update Helm image repository
        run: |
          sed -i "s|repository:.*|repository: $DOCKER_IMAGE|" \
            helm-cicd/values.yaml

      - name: Update Helm image tag
        run: |
          sed -i "s|tag:.*|tag: \"$IMAGE_TAG\"|" \
            helm-cicd/values.yaml

      - name: Validate Helm values
        run: |
          cat helm-cicd/values.yaml

      - name: Commit Helm update
        run: |
          git add helm-cicd/values.yaml
          git diff --cached --quiet || \
          git commit -m "chore: update image to $IMAGE_TAG"

      - name: Push Helm update
        run: |
          git push origin HEAD:main