name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "helm-cicd/**"
      - "README.md"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "helm-cicd/**"
      - "README.md"

permissions:
  contents: write

env:
  DOCKER_IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/cicd-demo
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ============================================================
  # 1. CODE QUALITY + SONARQUBE
  # ============================================================
  sonar:
    name: Build, Test and SonarQube
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Verify Node.js and pnpm
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test --coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ============================================================
  # 2. DEPENDENCY SECURITY
  # ============================================================
  security:
    name: Dependency Security Scan
    needs: sonar
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create reports directory
        run: mkdir -p reports

      # ========================================================
      # PNPM AUDIT
      # ========================================================
      - name: pnpm Security Audit
        continue-on-error: true
        run: |
          pnpm audit --audit-level=high --json > reports/pnpm-audit.json || true
          pnpm audit --audit-level=high > reports/pnpm-audit.txt || true

      # ========================================================
      # OWASP DEPENDENCY-CHECK
      # ========================================================
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: "cicd-demo"
          path: "."
          format: "ALL"
          out: "reports"
          args: >
            --enableRetired

      # ========================================================
      # UPLOAD SECURITY REPORTS
      # ========================================================
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14


  # ============================================================
  # 3. DOCKER BUILD + TRIVY
  # ============================================================
  docker:
    name: Docker Build + Trivy
    needs: security
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================================
      # BUILD DOCKER IMAGE
      # ========================================================
      - name: Build Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}

      # ========================================================
      # TRIVY TABLE REPORT
      # ========================================================
      - name: Generate Trivy Table Report
        id: trivy-table
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          format: "table"
          output: "trivy-report.txt"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"
          ignore-unfixed: true

      # ========================================================
      # TRIVY HTML REPORT
      # ========================================================
      - name: Generate Trivy HTML Report
        id: trivy-html
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          format: "template"
          template: "@contrib/html.tpl"
          output: "trivy-report.html"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"
          ignore-unfixed: true

      # ========================================================
      # PUBLISH TRIVY REPORT TO GITHUB SUMMARY
      # ========================================================
      - name: Publish Trivy Report to GitHub Summary
        if: always()
        run: |
          echo "## 🔐 Trivy Container Security Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Image:** \`${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Severity:** CRITICAL, HIGH, MEDIUM" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f trivy-report.txt ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat trivy-report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Trivy table report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ========================================================
      # UPLOAD TRIVY REPORTS
      # ========================================================
      - name: Upload Trivy Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports
          path: |
            trivy-report.txt
            trivy-report.html
          if-no-files-found: warn
          retention-days: 14


  # ============================================================
  # 4. DOCKER PUSH
  # ============================================================
  docker-push:
    name: Push Docker Image
    needs: docker

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================================
      # DOCKER HUB LOGIN
      # ========================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ========================================================
      # BUILD + PUSH IMMUTABLE SHA IMAGE
      # ========================================================
      - name: Build and Push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}


  # ============================================================
  # 5. UPDATE HELM
  # ============================================================
  helm-update:
    name: Update Helm Image
    needs: docker-push
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # CHECKOUT USING PAT
      # ========================================================
      - name: Checkout using GitHub PAT
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      # ========================================================
      # CONFIGURE GIT
      # ========================================================
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ========================================================
      # UPDATE IMAGE REPOSITORY
      # ========================================================
      - name: Update Helm image repository
        run: |
          sed -i "s|repository:.*|repository: $DOCKER_IMAGE|" \
            helm-cicd/values.yaml

      # ========================================================
      # UPDATE IMAGE TAG
      # ========================================================
      - name: Update Helm image tag
        run: |
          sed -i "s|tag:.*|tag: \"$IMAGE_TAG\"|" \
            helm-cicd/values.yaml

      # ========================================================
      # VALIDATE HELM VALUES
      # ========================================================
      - name: Validate Helm values
        run: |
          echo "Updated Helm values:"
          cat helm-cicd/values.yaml

      # ========================================================
      # COMMIT HELM UPDATE
      # ========================================================
      - name: Commit Helm update
        run: |
          git add helm-cicd/values.yaml

          if git diff --cached --quiet; then
            echo "No Helm changes to commit."
          else
            git commit -m "chore: update image to $IMAGE_TAG"
          fi

      # ========================================================
      # PUSH HELM UPDATE
      # ========================================================
      - name: Push Helm update
        run: |
          git push origin HEAD:main