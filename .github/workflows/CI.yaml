name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "helm-cicd/**"
      - "README.md"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "helm-cicd/**"
      - "README.md"

env:
  DOCKER_IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/cicd-demo
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ============================================================
  # 1. CODE QUALITY + SONARQUBE
  # ============================================================
  sonar:
    name: Build, Test and SonarQube
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Enable Corepack
      # --------------------------------------------------------
      - name: Enable Corepack
        run: corepack enable

      # --------------------------------------------------------
      # Setup pnpm (must happen before setup-node's pnpm cache step)
      # --------------------------------------------------------
      - name: Setup pnpm
        run: corepack prepare pnpm@11.5.1 --activate

      # --------------------------------------------------------
      # Node.js 22
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # --------------------------------------------------------
      # Verify versions
      # --------------------------------------------------------
      - name: Verify Node.js and pnpm
        run: |
          node --version
          pnpm --version

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --------------------------------------------------------
      # Lint
      # --------------------------------------------------------
      - name: Run lint
        run: pnpm lint

      # --------------------------------------------------------
      # Tests + Coverage
      # --------------------------------------------------------
      - name: Run tests
        run: pnpm test --coverage

      # --------------------------------------------------------
      # SonarQube Scan
      # --------------------------------------------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # --------------------------------------------------------
      # SonarQube Quality Gate
      # --------------------------------------------------------
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================
  # 2. DEPENDENCY SECURITY
  # ============================================================
  security:
    name: Dependency Security Scan
    needs: sonar
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Enable Corepack
      # --------------------------------------------------------
      - name: Enable Corepack
        run: corepack enable

      # --------------------------------------------------------
      # Setup pnpm (must happen before setup-node's pnpm cache step)
      # --------------------------------------------------------
      - name: Setup pnpm
        run: corepack prepare pnpm@11.5.1 --activate

      # --------------------------------------------------------
      # Node.js 22
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --------------------------------------------------------
      # pnpm Audit
      # --------------------------------------------------------
      - name: pnpm Security Audit
        run: pnpm audit --audit-level=high

      # --------------------------------------------------------
      # OWASP Dependency-Check
      # --------------------------------------------------------
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "cicd-demo"
          path: "."
          format: "ALL"
          out: "reports"
          args: >
            --failOnCVSS 7
            --enableRetired

      # --------------------------------------------------------
      # Upload OWASP reports
      # --------------------------------------------------------
      - name: Upload OWASP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

  # ============================================================
  # 3. DOCKER BUILD + TRIVY
  # ============================================================
  docker:
    name: Docker Build + Trivy
    needs: security
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t "$DOCKER_IMAGE:$IMAGE_TAG" \
            .

      # --------------------------------------------------------
      # Show image
      # --------------------------------------------------------
      - name: Show Docker image
        run: |
          docker images "$DOCKER_IMAGE"

      # --------------------------------------------------------
      # Trivy vulnerability scan
      # --------------------------------------------------------
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

  # ============================================================
  # 4. DOCKER PUSH
  # ============================================================
  docker-push:
    name: Push Docker Image
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Login to Docker Hub
      # --------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --------------------------------------------------------
      # Build image again
      # --------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t "$DOCKER_IMAGE:$IMAGE_TAG" \
            .

      # --------------------------------------------------------
      # Push immutable SHA image
      # --------------------------------------------------------
      - name: Push Docker image
        run: |
          docker push "$DOCKER_IMAGE:$IMAGE_TAG"

  # ============================================================
  # 5. UPDATE HELM
  # ============================================================
  helm-update:
    name: Update Helm Image
    needs: docker-push
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # Checkout using PAT
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      # --------------------------------------------------------
      # Configure Git
      # --------------------------------------------------------
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # --------------------------------------------------------
      # Update image repository
      # --------------------------------------------------------
      - name: Update Helm image repository
        run: |
          sed -i "s|repository:.*|repository: $DOCKER_IMAGE|" \
            helm-cicd/values.yaml

      # --------------------------------------------------------
      # Update image tag
      # --------------------------------------------------------
      - name: Update Helm image tag
        run: |
          sed -i "s|tag:.*|tag: \"$IMAGE_TAG\"|" \
            helm-cicd/values.yaml

      # --------------------------------------------------------
      # Validate Helm values
      # --------------------------------------------------------
      - name: Show Helm values
        run: |
          cat helm-cicd/values.yaml

      # --------------------------------------------------------
      # Commit Helm update
      # --------------------------------------------------------
      - name: Commit Helm update
        run: |
          git add helm-cicd/values.yaml

          git diff --cached --quiet || \
          git commit -m "chore: update image to $IMAGE_TAG"

      # --------------------------------------------------------
      # Push Helm update
      # --------------------------------------------------------
      - name: Push Helm update
        run: |
          git push origin HEAD:main